[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tr-transpiler"
version = "1.0.0"
description = "Türkçe sözde kodu C++, Python, Dart, Java, Rust, Go ve JavaScript'e çeviren kural tabanlı dönüştürücü"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trc = "transpiler.cli.main:main"

[tool.setuptools.packages.find]
include = ["transpiler*"]
